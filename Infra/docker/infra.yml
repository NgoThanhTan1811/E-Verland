name: Terraform

on:
  push:
    branches: [main, v2/be]
    paths:
      - "Infra/terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Write terraform.tfvars
        run: |
          cat > Infra/terraform/terraform.tfvars <<EOF
          project_name         = "e-verland"
          aws_region           = "ap-southeast-1"
          domain_name          = "e-verland.site"
          zone_id              = "${{ secrets.CLOUDFLARE_ZONE_ID }}"
          cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"

          backend_url  = "https://api.e-verland.site"
          frontend_url = "https://e-verland.site"

          s3_bucket_name      = "${{ secrets.S3_BUCKET_NAME }}"
          s3_region           = "auto"
          s3_service_url      = "${{ secrets.R2_ENDPOINT_URL }}"
          s3_force_path_style = true
          r2_account_id       = "${{ secrets.R2_ACCOUNT_ID }}"

          acm_certificate_arn = "${{ secrets.ACM_CERTIFICATE_ARN }}"

          container_image     = "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/e-verland-backend:latest"
          desired_count       = 2
          ecs_cpu             = 1024
          ecs_memory          = 2048

          mongodb_database_name = "e-verland-chat"
          app_secrets_arn       = "${{ secrets.APP_SECRETS_ARN }}"
          EOF

      - name: Terraform Init & Apply
        id: tf_run
        working-directory: Infra/terraform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} 
        run: |
          terraform init
          terraform apply -auto-approve 2>&1 | tee terraform.log

      - name: Force Unlock if Cancelled or Failed
        if: always() && (steps.tf_run.outcome == 'cancelled' || steps.tf_run.outcome == 'failure')
        working-directory: Infra/terraform
        run: |
          echo "Hệ thống bị hủy hoặc lỗi. Đang kiểm tra và tự động gỡ lock..."
          if [ -f terraform.log ]; then
            # Trích xuất chuẩn xác chuỗi Lock ID do S3 trả về
            LOCK_ID=$(grep -oE "ID:\s+[0-9a-fA-F-]+" terraform.log | awk '{print $2}' | head -n 1)
            if [ ! -z "$LOCK_ID" ]; then
              echo "Phát hiện Lock ID bị kẹt: $LOCK_ID. Tiến hành gỡ khóa tự động..."
              terraform force-unlock -force $LOCK_ID
            else
              echo "Không tìm thấy thông tin Lock ID cụ thể trong file log."
            fi
          else
            echo "Không tìm thấy file log ghi nhận."
          fi