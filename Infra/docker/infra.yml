name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "Infra/terraform/**"
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Write terraform.tfvars
        run: |
          cat > Infra/terraform/terraform.tfvars <<EOF
          project_name         = "e-verland"
          aws_region           = "ap-southeast-1"

          # Đặt cứng domain để giảm bớt gánh nặng tạo GitHub Secret
          domain_name          = "e-verland.site"
          cloudflare_api_token = "${{ secrets.CLOUDFLARE_API_TOKEN }}"

          backend_url  = "https://api.e-verland.site"
          frontend_url = "https://e-verland.site"

          s3_bucket_name      = "${{ secrets.S3_BUCKET_NAME }}"
          s3_region           = "auto"
          s3_service_url      = "${{ secrets.R2_ENDPOINT_URL }}"
          s3_force_path_style = true
          r2_account_id       = "${{ secrets.R2_ACCOUNT_ID }}"

          acm_certificate_arn = "${{ secrets.ACM_CERTIFICATE_ARN }}"

          container_image     = "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/e-verland-backend:latest"
          desired_count       = 2
          ecs_cpu             = 1024
          ecs_memory          = 2048

          mongodb_database_name = "e-verland-chat"
          app_secrets_arn       = "${{ secrets.AWS_SECRETS_ARN }}"
          EOF

      - name: Terraform Init
        run: terraform -chdir=Infra/terraform init

      - name: Terraform Plan
        run: terraform -chdir=Infra/terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=Infra/terraform apply tfplan
