name: Deploy Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: e-verland-production
      ECS_SERVICE: e-verland-app
      ECS_TASK_FAMILY: e-verland-task

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - run: |
          docker build -f Infra/docker/dockerfile -t ${{ steps.ecr.outputs.registry }}/e-verland-backend:${{ github.ref_name }} .
          docker tag ${{ steps.ecr.outputs.registry }}/e-verland-backend:${{ github.ref_name }} ${{ steps.ecr.outputs.registry }}/e-verland-backend:latest
          docker push ${{ steps.ecr.outputs.registry }}/e-verland-backend:${{ github.ref_name }}
          docker push ${{ steps.ecr.outputs.registry }}/e-verland-backend:latest

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query taskDefinition > task-definition.json

      - name: Prepare task definition for deployment
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: taskdef
        with:
          task-definition: task-definition-clean.json
          container-name: e-verland-app
          image: ${{ steps.ecr.outputs.registry }}/e-verland-backend:latest

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          wait-for-service-stability: true