name: CI/CD E-Verland (AWS)

on:
  push:
    branches: [ main, v2/be ]
  workflow_dispatch:

jobs:
  # JOB 1: Build và đẩy image lên ECR
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build and push
        id: build-image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/e-verland-backend:${{ github.sha }}
          docker build -f Infra/docker/dockerfile -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

  # JOB 2: Cập nhật hạ tầng (ECS sẽ tự cập nhật khi thấy image thay đổi)
  terraform:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: Infra/terraform
        env:
          TF_VAR_cloudflare_api_token ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_app_secrets_arn: ${{ secrets.APP_SECRETS_ARN }}
          TF_VAR_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          # TRUYỀN IMAGE MỚI VÀO TERRAFORM Ở ĐÂY
          TF_VAR_container_image: ${{ needs.build-and-push.outputs.image }}
        run: |
          terraform init
          terraform apply -auto-approve